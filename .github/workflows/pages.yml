name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage portfolio files
        run: |
          mkdir -p _site/assets/css _site/assets/fonts _site/attachments
          cp index.html _site/index.html
          cp assets/css/font-awesome.min.css _site/assets/css/
          cp -R assets/fonts/. _site/assets/fonts/
          cp attachments/kulsoom-portrait-passport.png attachments/kulsoom-portrait-mustard-cutout.png attachments/kulsoom-portrait-office-cutout.png _site/attachments/
          cp attachments/Kulsoom_Bano_Master_CV_v2.docx _site/attachments/
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
